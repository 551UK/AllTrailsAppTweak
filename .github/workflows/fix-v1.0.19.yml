name: Fix v1.0.19 source casts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v1.0.19.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LinkFix19 and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('LinkFix19.xm')
          s = p.read_text()
          old1 = 'const uint8_t *bytes = data.bytes;'
          new1 = 'const uint8_t *bytes = (const uint8_t *)data.bytes;'
          old2 = 'uint8_t *bytes = data.mutableBytes;'
          new2 = 'uint8_t *bytes = (uint8_t *)data.mutableBytes;'
          if old1 not in s or old2 not in s:
              raise SystemExit('Expected v1.0.19 cast lines not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git rm .github/workflows/fix-v1.0.19.yml
          git config user.name '551'
          git config user.email 'actions@github.com'
          git add LinkFix19.xm
          git commit -m 'Fix v1.0.19 Objective-C++ byte casts'
          git push origin HEAD:main
