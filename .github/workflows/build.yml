name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alltrailsapptweak-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "$deb" Package)" = com.551.alltrailsapptweak
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/alltrails-check"

          binary="$RUNNER_TEMP/alltrails-check/var/jb/Library/MobileSubstrate/DynamicLibraries/AllTrailsAppTweak.dylib"
          filter="$RUNNER_TEMP/alltrails-check/var/jb/Library/MobileSubstrate/DynamicLibraries/AllTrailsAppTweak.plist"

          test -s "$binary"
          test -s "$filter"
          xcrun lipo "$binary" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - name: Export DEB transport
        shell: bash
        run: |
          set -euo pipefail
          deb=(packages/*.deb)
          version="$(sed -n 's/^Version: //p' control)"
          transport="com.551.alltrailsapptweak_${version}_iphoneos-arm64.deb.b64"
          transport_dir="transport/v${version}"
          rm -rf "$transport_dir"
          mkdir -p "$transport_dir"
          python3 - "$deb" "$transport" "$transport_dir" <<'PY'
          import base64, pathlib, sys
          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          outdir = pathlib.Path(sys.argv[3])
          encoded = base64.b64encode(src.read_bytes()).decode('ascii')
          dst.write_text(encoded)
          chunk_size = 2500
          for i in range(0, len(encoded), chunk_size):
              (outdir / f'{i // chunk_size:03d}.b64').write_text(encoded[i:i + chunk_size])
          PY
          git config user.name "551"
          git config user.email "actions@github.com"
          git add -f "$transport" "$transport_dir"
          git commit -m "Export v${version} DEB transport [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@v4
        with:
          name: AllTrailsAppTweak-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish latest DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"

          if gh release view "$current" >/dev/null 2>&1; then
            gh release upload "$current" packages/*.deb --clobber
          else
            gh release create "$current" packages/*.deb \
              --target "$GITHUB_SHA" --title "AllTrailsAppTweak ${version}" \
              --notes "Rootless AllTrails link fix for older app versions."
          fi
