name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alltrailslinkfix-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Test URL routing
        run: |
          clang -fobjc-arc -framework Foundation tests/LinkURLTests.m -o "$RUNNER_TEMP/link-url-tests"
          "$RUNNER_TEMP/link-url-tests"

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64
          test "$(dpkg-deb -f "$deb" Package)" = com.551.alltrailsapptweak
          test "$(dpkg-deb -f "$deb" Name)" = AllTrailsLinkFix
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/alltrails-check"

          binary="$RUNNER_TEMP/alltrails-check/var/jb/Library/MobileSubstrate/DynamicLibraries/AllTrailsLinkFix.dylib"
          filter="$RUNNER_TEMP/alltrails-check/var/jb/Library/MobileSubstrate/DynamicLibraries/AllTrailsLinkFix.plist"

          test -s "$binary"
          test -s "$filter"
          xcrun lipo "$binary" -verify_arch arm64 arm64e
          plutil -lint "$filter"

      - uses: actions/upload-artifact@v4
        with:
          name: AllTrailsLinkFix-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Remove older tweak releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "$current" ] && continue
            gh release delete "$tag" --yes --cleanup-tag
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

      - name: Publish latest DEB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"
          notes="AllTrailsLinkFix fixes shared trail links for the premium-unlocked AllTrails 23.2.40 IPA on rootless iOS 16. It carries the complete trail URL into AllTrails and hands it to the app's native website-link parser so the correct trail opens directly. The matching AllTrails 23.2.40 IPA will also be placed in this release alongside the DEB."

          if gh release view "$current" >/dev/null 2>&1; then
            gh release upload "$current" packages/*.deb --clobber
            gh release edit "$current" --title "AllTrailsLinkFix ${version}" --notes "$notes"
          else
            gh release create "$current" packages/*.deb \
              --target "$GITHUB_SHA" --title "AllTrailsLinkFix ${version}" \
              --notes "$notes"
          fi
